name: travbook
services:
  # Local MOCK deployment only: fixture credentials and HTTP are not production settings.
  frontend:
    image: travbook-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://backend:8080
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend:
        condition: service_healthy
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/locations/DEL',{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)process.exit(1);return r.json()}).then(s=>{if(s.id!=='DEL')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  backend:
    image: travbook-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: compose-local
      DATABASE_URL: jdbc:postgresql://postgres:5432/travbook
      DATABASE_USERNAME: travbook
      DATABASE_PASSWORD: local-only-travbook
      BIND_ADDRESS: 0.0.0.0
      WEB_ORIGIN: http://127.0.0.1:3000
      INTEGRATION_MODE: MOCK
      NOTIFICATION_WORKER_ENABLED: "${NOTIFICATION_WORKER_ENABLED:-true}"
      DEMO_APIS_ENABLED: "${DEMO_APIS_ENABLED:-true}"
      DEMO_WORKER_ENABLED: "${DEMO_WORKER_ENABLED:-true}"
      JOURNEY_CARE_WORKER_ENABLED: "${JOURNEY_CARE_WORKER_ENABLED:-true}"
      JOURNEY_CARE_POLL_MS: "${JOURNEY_CARE_POLL_MS:-300}"
      JOURNEY_WORKER_ENABLED: "${JOURNEY_WORKER_ENABLED:-true}"
      JOURNEY_POLL_MS: "${JOURNEY_POLL_MS:-300}"
      RAIL_TICKET_WORKER_ENABLED: "${RAIL_TICKET_WORKER_ENABLED:-true}"
      RAIL_TICKET_POLL_MS: "${RAIL_TICKET_POLL_MS:-300}"
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      identity:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 45s
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  identity:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HTTP_PORT: "8180"
      KC_HOSTNAME: "http://127.0.0.1:8180"
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8180:8180"]
    volumes: ["./deploy/identity/travbook-realm.json:/opt/keycloak/data/import/travbook-realm.json:ro"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3; head -1 <&3 | grep -q '200'"]
      interval: 5s
      timeout: 5s
      retries: 30
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: travbook
      POSTGRES_USER: travbook
      POSTGRES_PASSWORD: local-only-travbook
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["travbook-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travbook -d travbook"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  travbook-data:
